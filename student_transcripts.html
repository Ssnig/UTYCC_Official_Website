<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ကျောင်းသားအမှတ်စာရင်းများ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --card-bg: #ffffff;
            --body-bg: #f1f5f9;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
        }
        body {
            font-family: 'Padauk', 'Inter', sans-serif;
            background-color: var(--body-bg);
            color: var(--text-primary);
        }
        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes staggeredFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .content-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        .image-card {
            animation: staggeredFadeIn 0.5s ease-out forwards;
            opacity: 0; /* Start hidden */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        .image-card:hover {
            transform: scale(1.05);
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25);
            z-index: 10;
        }
        /* Tab Styles */
        .year-tab-button.active {
            background-color: var(--primary-color);
            color: white;
            box-shadow: 0 4px 14px 0 rgba(59, 130, 246, 0.39);
        }
        .major-tab-button.active {
            color: var(--primary-hover);
            border-color: var(--primary-hover);
        }
        /* Hide scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* General Styles */
        .tab-content, .major-tab-content { display: none; }
        .tab-content.active, .major-tab-content.active { display: block; }
    </style>
</head>
<body class="antialiased">

    <!-- Header Section -->
    <header class="bg-white/80 backdrop-blur-lg shadow-sm sticky top-0 z-40">
        <div class="max-w-6xl mx-auto py-4 px-4 sm:px-6 lg:px-8">
            <h1 class="text-3xl font-bold text-center text-gray-900">အမှတ်စာရင်းများ</h1>
            <p class="text-center text-gray-500 mt-1">နှစ်နှင့် Major အလိုက် ရွေးချယ်ကြည့်ရှုပါ။</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="py-10">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <!-- Year Tabs Navigation -->
            <div class="mb-8">
                <nav id="year-tabs-nav" class="flex justify-center bg-white p-2 rounded-xl shadow-md gap-2" aria-label="Year Tabs">
                    <button class="year-tab-button active flex-1 sm:flex-none text-center py-3 px-6 font-semibold rounded-lg transition-all duration-300" data-target="#firstYear">ပထမနှစ်</button>
                    <button class="year-tab-button flex-1 sm:flex-none text-center py-3 px-6 font-semibold rounded-lg transition-all duration-300" data-target="#secondYear">ဒုတိယနှစ်</button>
                    <button class="year-tab-button flex-1 sm:flex-none text-center py-3 px-6 font-semibold rounded-lg transition-all duration-300" data-target="#thirdYear">တတိယနှစ်</button>
                    <button class="year-tab-button flex-1 sm:flex-none text-center py-3 px-6 font-semibold rounded-lg transition-all duration-300" data-target="#fourthYear">စတုတ္ထနှစ်</button>
                    <button class="year-tab-button flex-1 sm:flex-none text-center py-3 px-6 font-semibold rounded-lg transition-all duration-300" data-target="#fifthYear">ပဉ္စမနှစ်</button>
                </nav>
            </div>

            <!-- Content Container -->
            <div id="content-container">
                <!-- All Year Contents will be generated by JS -->
            </div>
        </div>
    </main>

    <!-- Image Modal -->
    <div id="imageModal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 hidden z-50 opacity-0 transition-opacity duration-300">
        <div class="bg-white p-2 rounded-lg shadow-2xl w-full max-w-4xl max-h-full transform scale-95 transition-transform duration-300">
            <div class="relative">
                <button id="closeModal" class="absolute -top-4 -right-4 bg-white rounded-full p-2 text-gray-600 hover:text-gray-900 hover:bg-gray-100 z-10 transition">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
                <img id="modalImage" src="" alt="အမှတ်စာရင်း အကြီးချဲ့ပုံ" class="rounded-md object-contain w-full" style="max-height: 85vh;">
            </div>
        </div>
    </div>

    <!-- JS Templates for Content -->
    <template id="year-content-template">
        <div class="tab-content">
            <div class="mb-8 flex justify-center">
                <nav class="major-tabs-nav flex flex-wrap justify-center gap-x-6 gap-y-2 border-b-2 border-gray-200 pb-2" aria-label="Major Tabs"></nav>
            </div>
            <div class="major-content-container min-h-[300px]"></div>
        </div>
    </template>
    
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        lucide.createIcons();

        // Data for transcripts. In a real app, this would come from a database.
        const yearData = {
            firstYear: {
                IST: ["1000103714.jpg", "https://placehold.co/600x800/e0f2fe/0c4a6e?text=IST+1-A"],
                CE: ["https://placehold.co/600x800/ede9fe/5b21b6?text=CE+1-B"],
                EcE: ["https://placehold.co/600x800/dcfce7/166534?text=EcE+1-C"],
                PrE: [],
                AME: ["https://placehold.co/600x800/fef9c3/854d0e?text=AME+1-D"]
            },
            secondYear: {
                IST: ["https://placehold.co/600x800/e0f2fe/0c4a6e?text=IST+2-A"],
                CE: ["https://placehold.co/600x800/dbeafe/1e3a8a?text=CE+2-B", "https://placehold.co/600x800/ede9fe/5b21b6?text=CE+2-C"],
                EcE: ["https://placehold.co/600x800/c7d2fe/4338ca?text=EcE+2-D"],
                PrE: ["https://placehold.co/600x800/fce7f3/9d2667?text=PrE+2-E"],
                AME: []
            },
            thirdYear: {
                IST: ["./Img/photo_2025-08-21_21-14-36.jpg", "./Img/photo_2025-08-21_21-14-38.jpg"],
                CE: [],
                EcE: ["https://placehold.co/600x800/ccfbf1/0f766e?text=EcE+3-B", "https://placehold.co/600x800/dcfce7/166534?text=EcE+3-C"],
                PrE: ["https://placehold.co/600x800/fef3c7/92400e?text=PrE+3-D"],
                AME: ["https://placehold.co/600x800/ffedd5/9a3412?text=AME+3-E"]
            },
            fourthYear: {
                IST: [],
                CE: ["https://placehold.co/600x800/f3e8ff/6b21a8?text=CE+4-A"],
                EcE: ["https://placehold.co/600x800/eef2ff/4338ca?text=EcE+4-B"],
                PrE: [],
                AME: ["https://placehold.co/600x800/fee2e2/991b1b?text=AME+4-C", "https://placehold.co/600x800/ffedd5/9a3412?text=AME+4-D"]
            },
            fifthYear: {
                IST: ["https://placehold.co/600x800/e0e7ff/3730a3?text=IST+5-A", "https://placehold.co/600x800/e0f2fe/0c4a6e?text=IST+5-B"],
                CE: ["https://placehold.co/600x800/dbeafe/1e3a8a?text=CE+5-C"],
                EcE: [],
                PrE: ["https://placehold.co/600x800/fce7f3/9d2667?text=PrE+5-D"],
                AME: []
            }
        };
        
        const majors = ["IST", "CE", "EcE", "PrE", "AME"];
        const contentContainer = document.getElementById('content-container');
        const template = document.getElementById('year-content-template');

        // --- Content Generation ---
        function generateContent() {
            contentContainer.innerHTML = ''; // Clear previous content
            Object.keys(yearData).forEach(yearId => {
                const yearContent = template.content.cloneNode(true).querySelector('.tab-content');
                yearContent.id = yearId;

                const majorNav = yearContent.querySelector('.major-tabs-nav');
                const majorContainer = yearContent.querySelector('.major-content-container');

                majors.forEach(majorId => {
                    // Create major tab button
                    const button = document.createElement('button');
                    button.className = "major-tab-button py-2 px-3 border-b-2 font-semibold text-gray-500 border-transparent hover:text-blue-600 transition";
                    button.dataset.year = yearId;
                    button.dataset.major = majorId;
                    button.textContent = majorId;
                    majorNav.appendChild(button);

                    // Create major content div
                    const majorContent = document.createElement('div');
                    majorContent.id = `${yearId}-${majorId}`;
                    majorContent.className = 'major-tab-content';
                    
                    const images = yearData[yearId][majorId];
                    if (images.length > 0) {
                        const grid = document.createElement('div');
                        grid.className = 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6';
                        images.forEach((src, index) => {
                            const card = document.createElement('div');
                            card.className = 'bg-white rounded-xl overflow-hidden image-card shadow-lg relative';
                            card.style.animationDelay = `${index * 100}ms`;
                            card.innerHTML = `<img src="${src}" alt="အမှတ်စာရင်း ပုံ" class="w-full h-full object-cover" onerror="this.onerror=null;this.src='https://placehold.co/600x800/e2e8f0/334155?text=Image+Not+Found';">`;
                            grid.appendChild(card);
                        });
                        majorContent.appendChild(grid);
                    } else {
                        majorContent.innerHTML = `<p class="text-center text-gray-500 py-16">${majorId} အတွက် အမှတ်စာရင်း မရှိသေးပါ။</p>`;
                    }
                    majorContainer.appendChild(majorContent);
                });
                contentContainer.appendChild(yearContent);
            });
        }

        // --- Tab Logic ---
        function setupTabs() {
            const yearTabsNav = document.getElementById('year-tabs-nav');
            
            yearTabsNav.addEventListener('click', (e) => {
                if (e.target.classList.contains('year-tab-button')) {
                    yearTabsNav.querySelector('.active').classList.remove('active');
                    e.target.classList.add('active');
                    
                    const targetId = e.target.dataset.target;
                    contentContainer.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active', 'content-fade-in'));
                    
                    const targetContent = document.querySelector(targetId);
                    targetContent.classList.add('active', 'content-fade-in');
                    
                    // Activate the first major tab by default
                    const firstMajorButton = targetContent.querySelector('.major-tab-button');
                    if(firstMajorButton) firstMajorButton.click();
                }
            });

            contentContainer.addEventListener('click', (e) => {
                if (e.target.classList.contains('major-tab-button')) {
                    const { year, major } = e.target.dataset;
                    const majorNav = e.target.parentElement;
                    
                    majorNav.querySelector('.active')?.classList.remove('active');
                    e.target.classList.add('active');

                    const majorContainer = majorNav.closest('.tab-content').querySelector('.major-content-container');
                    majorContainer.querySelectorAll('.major-tab-content').forEach(c => c.classList.remove('active', 'content-fade-in'));
                    
                    const targetContent = document.getElementById(`${year}-${major}`);
                    targetContent.classList.add('active', 'content-fade-in');
                }
            });
        }

        // --- Modal Logic ---
        function setupModal() {
            const imageModal = document.getElementById('imageModal');
            const modalImage = document.getElementById('modalImage');
            const closeModal = document.getElementById('closeModal');

            contentContainer.addEventListener('click', (event) => {
                const card = event.target.closest('.image-card');
                if (card) {
                    modalImage.src = card.querySelector('img').src;
                    imageModal.classList.remove('hidden');
                    setTimeout(() => {
                        imageModal.classList.add('opacity-100');
                        imageModal.querySelector('div').classList.remove('scale-95');
                    }, 10);
                }
            });

            const hideModal = () => {
                imageModal.classList.remove('opacity-100');
                imageModal.querySelector('div').classList.add('scale-95');
                setTimeout(() => imageModal.classList.add('hidden'), 300);
            };

            closeModal.addEventListener('click', hideModal);
            imageModal.addEventListener('click', (event) => {
                if (event.target === imageModal) hideModal();
            });
        }

        // --- Initializer ---
        function init() {
            generateContent();
            setupTabs();
            setupModal();
            // Trigger a click on the first year tab to load initial content
            document.querySelector('.year-tab-button.active').click();
        }

        init();
    });
    </script>
</body>
</html>
