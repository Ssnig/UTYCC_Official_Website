<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Admin Dashboard</title>
    <!-- Use Tailwind CSS for responsive utility classes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Use a modern font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Custom CSS for animations and layout */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Consistent with Tailwind's gray-100 */
        }

        /* Define a fade-in animation for content */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Apply the animation to the main content */
        .content-container {
            animation: fadeIn 0.5s ease-out;
        }

        /* Sidebar transition for width */
        .sidebar {
            transition: width 0.3s ease-in-out;
        }

        /* Sidebar content opacity transition */
        .sidebar-content {
            transition: opacity 0.3s ease-in-out;
        }

        /* Hide content when sidebar is collapsed */
        .sidebar.collapsed .sidebar-text {
            opacity: 0;
            pointer-events: none; /* Make sure hidden text isn't clickable */
            display: none;
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar flex flex-col bg-indigo-800 text-white w-64 md:w-64">
        <div class="flex items-center justify-between p-6 h-20 bg-indigo-900">
            <h1 class="text-xl font-bold sidebar-text">Admin Panel</h1>
            <button id="sidebar-toggle" class="p-2 rounded-lg hover:bg-indigo-800 transition-colors">
                <!-- Lucide-react Menu icon SVG -->
                <svg id="menu-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-menu"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
                <!-- Lucide-react ChevronRight icon SVG (initially hidden) -->
                <svg id="chevron-icon" class="hidden" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-right"><path d="m9 18 6-6-6-6"/></svg>
            </button>
        </div>
        <nav class="flex-1 p-4 overflow-y-auto">
            <ul class="space-y-2" id="nav-list">
                <!-- Nav items will be dynamically generated by JavaScript -->
            </ul>
        </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto">
        <!-- Header -->
        <header class="flex items-center justify-between p-6 h-20 bg-white shadow-md">
            <h2 id="main-header" class="text-2xl font-semibold text-gray-800">Dashboard</h2>
            <!-- Admin Profile Dropdown -->
            <div class="relative inline-block text-left">
                <button id="profile-menu-button" type="button" class="flex items-center space-x-4 p-2 rounded-full hover:bg-gray-100 transition-colors focus:outline-none" aria-expanded="true" aria-haspopup="true">
                    <span class="text-gray-600">Admin</span>
                    <div class="w-10 h-10 rounded-full bg-gray-300"></div>
                </button>

                <!-- Dropdown Menu -->
                <div id="profile-menu" class="absolute right-0 mt-2 w-56 origin-top-right rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 focus:outline-none transform scale-95 opacity-0 invisible transition-all duration-200" role="menu" aria-orientation="vertical" aria-labelledby="profile-menu-button" tabindex="-1">
                    <div class="py-1" role="none">
                        <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 nav-item" data-view="profile" role="menuitem" tabindex="-1">Profile</a>
                        <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 nav-item" data-view="settings" role="menuitem" tabindex="-1">Settings</a>
                        <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" role="menuitem" tabindex="-1">Sign Out</a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Dynamic Content -->
        <div id="content" class="p-6">
            <!-- Content will be rendered here by JavaScript -->
        </div>
    </main>

    <script>
        // === MOCK DATA ===
        const mockStudents = [
            { rollNo: 101, name: 'John Doe', email: 'john.doe@email.com', location: 'New York', majors: 'Computer Science', academicYear: 'First year' },
            { rollNo: 102, name: 'Jane Smith', email: 'jane.smith@email.com', location: 'London', majors: 'Mechanical Engineering', academicYear: 'First year' },
            { rollNo: 103, name: 'Peter Jones', email: 'peter.jones@email.com', location: 'Tokyo', majors: 'History', academicYear: 'Second year' },
            { rollNo: 104, name: 'Mary Williams', email: 'mary.williams@email.com', location: 'Sydney', majors: 'Graphic Design', academicYear: 'Second year' },
            { rollNo: 105, name: 'Robert Brown', email: 'robert.brown@email.com', location: 'New York', majors: 'Computer Science', academicYear: 'First year' },
        ];

        const mockCourses = [
            { id: 1, name: 'Introduction to Programming', code: 'CS101', instructor: 'Alice Johnson', studentsEnrolled: 50 },
            { id: 2, name: 'Advanced Mathematics', code: 'MATH201', instructor: 'Bob Adams', studentsEnrolled: 35 },
            { id: 3, name: 'History of Art', code: 'ART100', instructor: 'Charlie Davis', studentsEnrolled: 22 },
        ];

        const mockActivity = [
            { id: 1, type: 'Registration', description: 'John Doe registered as a new student.' },
            { id: 2, type: 'Enrollment', description: 'Jane Smith enrolled in CS101.' },
            { id: 3, type: 'Payment', description: 'Mary Williams submitted a payment of $500.' },
            { id: 4, type: 'Update', description: 'Peter Jones updated his profile information.' },
        ];

        // === DOM ELEMENTS AND STATE ===
        const contentDiv = document.getElementById('content');
        const mainHeader = document.getElementById('main-header');
        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebar-toggle');
        const navList = document.getElementById('nav-list');
        const menuIcon = document.getElementById('menu-icon');
        const chevronIcon = document.getElementById('chevron-icon');
        const profileMenuButton = document.getElementById('profile-menu-button');
        const profileMenu = document.getElementById('profile-menu');
        
        let isSidebarOpen = true;
        let isProfileMenuOpen = false;

        // === VIEW RENDERING FUNCTIONS ===
        const renderDashboard = () => {
            mainHeader.textContent = 'Dashboard';
            contentDiv.innerHTML = `
                <div class="p-6 space-y-8">
                    <!-- At-a-Glance Statistics -->
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        <!-- Stat Card: Total Students -->
                        <div class="flex items-center p-6 bg-blue-100 rounded-xl shadow-lg transition-transform duration-300 hover:scale-105">
                            <div class="p-4 rounded-full text-white bg-opacity-30 bg-blue-400">
                                <!-- Lucide User Icon -->
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            </div>
                            <div class="ml-4">
                                <h3 class="text-sm font-medium text-gray-500">Total Students</h3>
                                <p class="text-3xl font-semibold text-gray-900">${mockStudents.length}</p>
                            </div>
                        </div>

                        <!-- Stat Card: New Registrations -->
                        <div class="flex items-center p-6 bg-yellow-100 rounded-xl shadow-lg transition-transform duration-300 hover:scale-105">
                            <div class="p-4 rounded-full text-white bg-opacity-30 bg-yellow-400">
                                <!-- Lucide User Plus Icon -->
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user-plus"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg>
                            </div>
                            <div class="ml-4">
                                <h3 class="text-sm font-medium text-gray-500">New Registrations</h3>
                                <p class="text-3xl font-semibold text-gray-900">3</p>
                            </div>
                        </div>

                        <!-- Stat Card: Students Enrolled This Month -->
                        <div class="flex items-center p-6 bg-green-100 rounded-xl shadow-lg transition-transform duration-300 hover:scale-105">
                            <div class="p-4 rounded-full text-white bg-opacity-30 bg-green-400">
                                <!-- Lucide Calendar Check Icon -->
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-calendar-check"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="m9 16 2 2 4-4"/></svg>
                            </div>
                            <div class="ml-4">
                                <h3 class="text-sm font-medium text-gray-500">Students Enrolled This Month</h3>
                                <p class="text-3xl font-semibold text-gray-900">5</p>
                            </div>
                        </div>

                        <!-- Stat Card: Recently Updated Profiles -->
                        <div class="flex items-center p-6 bg-purple-100 rounded-xl shadow-lg transition-transform duration-300 hover:scale-105">
                            <div class="p-4 rounded-full text-white bg-opacity-30 bg-purple-400">
                                <!-- Lucide Refresh CW Icon -->
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-refresh-cw"><path d="M21 12a9 9 0 0 0-9-9c-2.4 0-4.6 1-6.4 2.6L3 7"/><path d="M3 3v4h4"/><path d="M3 12a9 9 0 0 0 9 9c2.4 0 4.6-1 6.4-2.6L21 17"/><path d="M21 21v-4h-4"/></svg>
                            </div>
                            <div class="ml-4">
                                <h3 class="text-sm font-medium text-gray-500">Recently Updated Profiles</h3>
                                <p class="text-3xl font-semibold text-gray-900">2</p>
                            </div>
                        </div>
                    </div>

                    <!-- Recent Activity Feed -->
                    <div class="bg-white p-6 rounded-xl shadow-lg">
                        <h2 class="text-xl font-semibold text-gray-800 mb-4">Recent Activity</h2>
                        <ul class="space-y-4">
                            ${mockActivity.map(activity => `
                                <li class="flex items-center space-x-3">
                                    <span class="p-2 bg-gray-100 rounded-full text-gray-500">
                                        <!-- Dynamic icon based on activity type -->
                                        ${activity.type === 'Registration' ? '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>' : ''}
                                        ${activity.type === 'Enrollment' ? '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-book"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>' : ''}
                                        ${activity.type === 'Payment' ? '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-credit-card"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>' : ''}
                                        ${activity.type === 'Update' ? '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-settings"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.39a2 2 0 0 0 .73 2.73l.15.08a2 2 0 0 1 1 1.74v.17a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>' : ''}
                                    </span>
                                    <p class="text-gray-700">${activity.description}</p>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                </div>
            `;
        };

        const renderStudentManagement = (searchTerm = '') => {
            mainHeader.textContent = 'Student Management';

            // Filter students by name or location
            const filteredStudents = mockStudents.filter(student =>
                student.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                student.location.toLowerCase().includes(searchTerm.toLowerCase())
            );

            contentDiv.innerHTML = `
                <div class="p-6 space-y-6">
                    <div class="flex flex-col md:flex-row items-center justify-between space-y-4 md:space-y-0">
                        <h2 class="text-2xl font-semibold text-gray-800">Student Management</h2>
                        <div class="flex items-center space-x-4">
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                                    <!-- Lucide Search Icon -->
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search text-gray-400"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                                </div>
                                <input
                                    id="search-input"
                                    type="text"
                                    placeholder="Search students by name or location..."
                                    value="${searchTerm}"
                                    class="pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition-shadow"
                                />
                            </div>
                        </div>
                    </div>

                    <div class="bg-white p-6 rounded-xl shadow-lg overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ROLL NO</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Address</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">MAJORS</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Academic Year</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200">
                                ${filteredStudents.map(student => `
                                    <tr>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${student.rollNo}</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${student.name}</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${student.email}</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${student.location}</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${student.majors}</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${student.academicYear}</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                            <a href="#" class="text-indigo-600 hover:text-indigo-900 mr-4">Edit</a>
                                            <a href="#" class="text-red-600 hover:text-red-900">Delete</a>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
            // Add event listeners to the newly rendered elements
            document.getElementById('search-input').addEventListener('input', (e) => {
                renderStudentManagement(e.target.value);
            });
        };

        const renderCourseManagement = () => {
            mainHeader.textContent = 'Course Management';
            contentDiv.innerHTML = `
                <div class="p-6 space-y-6">
                    <h2 class="text-2xl font-semibold text-gray-800">Course Management</h2>
                    <div class="bg-white p-6 rounded-xl shadow-lg overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Course Name</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Course Code</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Instructor</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Enrolled Students</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200">
                                ${mockCourses.map(course => `
                                    <tr>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${course.id}</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${course.name}</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${course.code}</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${course.instructor}</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${course.studentsEnrolled}</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                            <a href="#" class="text-indigo-600 hover:text-indigo-900 mr-4">Edit</a>
                                            <a href="#" class="text-red-600 hover:text-red-900">Delete</a>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        };
        
        const renderProfile = () => {
             mainHeader.textContent = 'Admin Profile';
            contentDiv.innerHTML = `<div class="p-6"><h2 class="text-2xl font-semibold">Admin Profile View</h2><p class="mt-4 text-gray-600">This is where the admin profile information would go.</p></div>`;
        };

        const renderPayments = () => {
            mainHeader.textContent = 'Payments';
            contentDiv.innerHTML = `<div class="p-6"><h2 class="text-2xl font-semibold">Payment Management View</h2></div>`;
        };

        const renderSettings = () => {
            mainHeader.textContent = 'Settings';
            contentDiv.innerHTML = `<div class="p-6"><h2 class="text-2xl font-semibold">Settings View</h2><p class="mt-4 text-gray-600">This is the settings page, now accessible from the profile menu.</p></div>`;
        };

        // Mapping views to their rendering functions
        const views = {
            'dashboard': renderDashboard,
            'students': renderStudentManagement,
            'courses': renderCourseManagement,
            'payments': renderPayments,
            'profile': renderProfile,
            'settings': renderSettings
        };

        // === INITIALIZATION & EVENT LISTENERS ===
        window.onload = () => {
            // Render initial navigation
            // Removed the "Settings" item from the main nav list
            const navItems = [
                { name: 'Dashboard', icon: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-home"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>', view: 'dashboard' },
                { name: 'Students', icon: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>', view: 'students' },
                { name: 'Courses', icon: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-book"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>', view: 'courses' },
                { name: 'Payments', icon: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-credit-card"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>', view: 'payments' },
            ];

            navList.innerHTML = navItems.map(item => `
                <li class="flex items-center p-3 rounded-lg cursor-pointer transition-colors duration-200 text-indigo-100 hover:bg-indigo-600 nav-item" data-view="${item.view}">
                    ${item.icon}
                    <span class="ml-4 text-sm font-medium sidebar-text">${item.name}</span>
                </li>
            `).join('');
            
            // Set initial active nav item and render default view
            document.querySelector('.nav-item[data-view="dashboard"]').classList.add('bg-indigo-700', 'text-white', 'shadow-md');
            document.querySelector('.nav-item[data-view="dashboard"]').classList.remove('text-indigo-100', 'hover:bg-indigo-600');
            renderDashboard();

            // Attach click listeners to nav items
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', () => {
                    // Remove active class from all nav items
                    document.querySelectorAll('.nav-item').forEach(el => {
                        el.classList.remove('bg-indigo-700', 'text-white', 'shadow-md');
                        el.classList.add('text-indigo-100', 'hover:bg-indigo-600');
                    });
                    // Add active class to the clicked item
                    item.classList.add('bg-indigo-700', 'text-white', 'shadow-md');
                    item.classList.remove('text-indigo-100', 'hover:bg-indigo-600');
                    const view = item.getAttribute('data-view');
                    if (views[view]) {
                        views[view]();
                    }
                });
            });

            // Handle sidebar toggle
            sidebarToggle.addEventListener('click', () => {
                if (isSidebarOpen) {
                    sidebar.classList.add('w-20');
                    sidebar.classList.remove('w-64');
                    sidebar.querySelectorAll('.sidebar-text').forEach(el => el.style.opacity = '0');
                    setTimeout(() => {
                        sidebar.querySelectorAll('.sidebar-text').forEach(el => el.style.display = 'none');
                    }, 300); // Wait for transition to finish
                    menuIcon.classList.add('hidden');
                    chevronIcon.classList.remove('hidden');
                } else {
                    sidebar.classList.remove('w-20');
                    sidebar.classList.add('w-64');
                    sidebar.querySelectorAll('.sidebar-text').forEach(el => el.style.display = 'block');
                    setTimeout(() => {
                        sidebar.querySelectorAll('.sidebar-text').forEach(el => el.style.opacity = '1');
                    }, 10);
                    chevronIcon.classList.add('hidden');
                    menuIcon.classList.remove('hidden');
                }
                isSidebarOpen = !isSidebarOpen;
            });
            
            // Handle profile menu toggle
            profileMenuButton.addEventListener('click', (e) => {
                e.stopPropagation(); // Prevent the click from propagating to the document listener
                isProfileMenuOpen = !isProfileMenuOpen;
                if (isProfileMenuOpen) {
                    profileMenu.classList.remove('scale-95', 'opacity-0', 'invisible');
                    profileMenu.classList.add('scale-100', 'opacity-100', 'visible');
                } else {
                    profileMenu.classList.remove('scale-100', 'opacity-100', 'visible');
                    profileMenu.classList.add('scale-95', 'opacity-0', 'invisible');
                }
            });

            // Close the dropdown if the user clicks outside of it
            document.addEventListener('click', (e) => {
                if (!profileMenu.contains(e.target) && !profileMenuButton.contains(e.target)) {
                    isProfileMenuOpen = false;
                    profileMenu.classList.remove('scale-100', 'opacity-100', 'visible');
                    profileMenu.classList.add('scale-95', 'opacity-0', 'invisible');
                }
            });
        };
    </script>
</body>
</html>
