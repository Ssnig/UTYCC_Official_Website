<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Dashboard — Courses</title>
  <meta name="description" content="Admin dashboard for a student registration system." />
  <link rel="canonical" href="/courses.html" />

  <style>
    :root {
      /* Light theme (HSL) - White and Blue Theme */
      --bg: 0 0% 100%; /* White background */
      --fg: 222 47% 11%; /* Dark text */
      --muted: 214 32% 91%;
      --muted-foreground: 215 17% 47%;
      
      --primary: 220 70% 55%; /* Professional Blue */
      --primary-foreground: 0 0% 100%; /* White */
      
      --secondary: 0 0% 100%; /* White sidebar background */
      --secondary-foreground: 222 47% 11%; /* Dark sidebar text */
      
      --card: 0 0% 100%; /* White */
      --card-foreground: 222 47% 11%;
      --border: 214 32% 91%;
      --ring: 220 70% 55%;
      --success: 153 61% 34%;
      --warning: 43 96% 56%;
      --danger: 0 84% 60%;
      --radius: 12px;

      /* Motion */
      --ease: cubic-bezier(.2,.8,.2,1);
      --duration: 220ms;

      /* Shadows */
      --shadow-soft: 0 10px 30px -12px hsl(var(--primary)/0.25);
      --shadow-card: 0 10px 20px -10px hsl(220 40% 20% / 0.15);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: hsl(var(--fg));
      background: hsl(var(--bg));
      font: 500 16px/1.4 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji";
      text-rendering: optimizeLegibility;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; }

    /* Layout */
    .app {
      display: grid;
      grid-template-columns: 280px 1fr;
      grid-template-rows: 72px 1fr;
      grid-template-areas:
        "sidebar header"
        "sidebar main";
      min-height: 100dvh;
    }
    .sidebar {
      grid-area: sidebar;
      border-right: 1px solid hsl(var(--border));
      background: hsl(var(--secondary));
      padding: 20px 16px;
      position: sticky; top: 0; height: 100dvh;
    }
    .brand {
      display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px;
      background: transparent; border: 1px solid hsl(var(--border));
    }
    .brand-badge { width: 12px; height: 12px; border-radius: 4px; background: hsl(var(--primary)); box-shadow: 0 0 0 4px hsl(var(--primary)/0.15); }
    .brand h1 { font-size: 16px; margin: 0; letter-spacing: .2px; color: hsl(var(--secondary-foreground)); }
    nav { margin-top: 18px; display: grid; gap: 8px; }
    .nav-link { padding: 10px 12px; border-radius: 10px; color: hsl(var(--muted-foreground)); border: 1px solid transparent; transition: background var(--duration) var(--ease), color var(--duration) var(--ease), border var(--duration) var(--ease); }
    .nav-link:hover { background: hsl(210 40% 98%); color: hsl(var(--fg)); }
    .nav-link.active { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); box-shadow: var(--shadow-soft); }

    .header {
      grid-area: header;
      position: sticky; top: 0; z-index: 10;
      background: hsl(var(--card));
      border-bottom: 1px solid hsl(var(--border));
      display: flex; align-items: center; gap: 12px; padding: 16px 20px;
    }
    .search {
      flex: 1; display: flex; gap: 8px; align-items: center; background: hsl(210 40% 98%); border: 1px solid hsl(var(--border)); border-radius: 12px; padding: 10px 12px; box-shadow: var(--shadow-card);
    }
    .search input { width: 100%; border: none; outline: none; background: transparent; color: hsl(var(--fg)); }

    .userbar { display: flex; gap: 8px; align-items: center; }

    .btn {
      --bcol: var(--border);
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 10px 14px; border-radius: 12px; border: 1px solid hsl(var(--bcol));
      background: hsl(var(--card)); color: hsl(var(--fg));
      box-shadow: var(--shadow-card);
      transition: transform var(--duration) var(--ease), box-shadow var(--duration) var(--ease), background var(--duration) var(--ease), color var(--duration) var(--ease), border-color var(--duration) var(--ease);
      cursor: pointer;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 10px 30px -12px hsl(var(--fg)/0.25); }
    .btn:focus-visible { outline: 2px solid hsl(var(--ring)); outline-offset: 2px; }
    .btn.primary { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); border-color: hsl(var(--primary)); }
    .btn.destructive { background: hsl(var(--danger)); color: hsl(0 0% 100%); border-color: hsl(var(--danger)); }
    .btn.ghost { background: transparent; border-color: hsl(var(--border)); }

    .main { grid-area: main; padding: 20px; background: hsl(210 40% 98%);}

    .section { margin-top: 24px; }
    .section-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
    .section-header h2 { font-size: 20px; margin: 0; }

    /* Table */
    .table-wrap { overflow: auto; border: 1px solid hsl(var(--border)); border-radius: var(--radius); background: hsl(var(--card)); box-shadow: var(--shadow-card); }
    table { width: 100%; border-collapse: collapse; min-width: 600px; }
    thead th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: hsl(var(--muted-foreground)); background: hsl(var(--bg)); position: sticky; top: 0; z-index: 1; }
    th, td { padding: 12px 14px; border-bottom: 1px solid hsl(var(--border)); }
    tbody tr:hover { background: hsl(210 40% 98%); }
  </style>

</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" aria-label="Sidebar navigation">
      <div class="brand" aria-label="Brand">
        <div class="brand-badge" aria-hidden="true"></div>
        <h1>Student Registration</h1>
      </div>
      <nav>
        <a class="nav-link" href="./admin.html">Students</a>
        <a class="nav-link active" href="./courses.html">Courses</a>
        <a class="nav-link" href="./registrations.html">Registrations</a>
        <a class="nav-link" href="./reports.html">Reports</a>
        <a class="nav-link" href="./settings.html">Settings</a>
      </nav>
    </aside>

    <header class="header" id="header">
      <form class="search" role="search" aria-label="Search courses" onsubmit="event.preventDefault()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="2"/></svg>
        <input id="search" name="q" placeholder="Search courses..." autocomplete="off" />
      </form>
      <div class="userbar">
        <button class="btn primary" id="addBtn" aria-label="Add course">Add Course</button>
      </div>
    </header>

    <main class="main" id="main">
      <section class="section" id="courses">
        <div class="section-header">
          <h2>Courses</h2>
        </div>

        <div class="table-wrap">
          <table aria-describedby="courses table">
            <thead>
              <tr>
                <th>Course Name</th>
                <th>Code</th>
                <th>Students Enrolled</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- Modal: Add/Edit Course -->
  <dialog id="courseModal" aria-modal="true">
    <form method="dialog" id="courseForm">
      <div class="modal-header">
        <strong id="modalTitle">Add Course</strong>
        <button class="btn ghost" type="button" id="closeModal" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="courseId" />
        <div class="field">
          <label for="name">Course Name</label>
          <input id="name" required placeholder="e.g., Computer Science" />
        </div>
        <div class="field">
          <label for="code">Course Code</label>
          <input id="code" required placeholder="e.g., CS101" />
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn ghost" value="cancel" type="button" id="cancelModal">Cancel</button>
        <button class="btn primary" value="default" id="saveCourse">Save</button>
      </div>
    </form>
  </dialog>

  <script defer>
    const STORAGE_KEY = 'srs_courses_v1';

    const state = {
      courses: [],
    };

    function uid() { return Math.random().toString(36).slice(2, 10); }

    function load() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      try { return JSON.parse(raw); } catch { return []; }
    }
    function save(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function seedIfEmpty() {
      const cur = load();
      if (cur.length) return;
      const samples = [
        ['Computer Science', 'CS101'],
        ['Mathematics', 'MATH203'],
        ['Physics', 'PHY101'],
        ['Chemistry', 'CHEM101'],
        ['Economics', 'ECON202'],
        ['Biology', 'BIO101'],
        ['Philosophy', 'PHIL301'],
        ['Data Science', 'DS310'],
        ['Engineering', 'ENGR100'],
        ['Literature', 'LIT205']
      ];
      const seeded = samples.map(([name, code]) => ({
        id: uid(), name, code, enrolled: Math.floor(Math.random() * 100)
      }));
      save(seeded);
    }

    // DOM refs
    const tbody = document.getElementById('tbody');
    const addBtn = document.getElementById('addBtn');

    // Modal refs
    const modal = document.getElementById('courseModal');
    const modalTitle = document.getElementById('modalTitle');
    const closeModal = document.getElementById('closeModal');
    const cancelModal = document.getElementById('cancelModal');
    const saveCourseBtn = document.getElementById('saveCourse');
    const courseId = document.getElementById('courseId');
    const nameEl = document.getElementById('name');
    const codeEl = document.getElementById('code');

    function openModal(mode, course = null) {
      modalTitle.textContent = mode === 'edit' ? 'Edit Course' : 'Add Course';
      if (mode === 'edit' && course) {
        courseId.value = course.id; 
        nameEl.value = course.name; 
        codeEl.value = course.code;
      } else {
        courseId.value = ''; 
        nameEl.value = ''; 
        codeEl.value = '';
      }
      modal.showModal();
      nameEl.focus();
    }
    function closeModalSafe() { modal.close(); }

    function renderTable() {
      tbody.innerHTML = '';
      for (const course of state.courses) {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${course.name}</td>
          <td>${course.code}</td>
          <td>${course.enrolled}</td>
          <td>
            <div style="display:flex; gap:6px;">
              <button class="btn ghost" data-edit="${course.id}">Edit</button>
              <button class="btn destructive" data-del="${course.id}">Delete</button>
            </div>
          </td>`;
        tbody.appendChild(tr);
      }

      // Action handlers
      tbody.querySelectorAll('[data-edit]').forEach(btn => btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-edit');
        const course = state.courses.find(c => c.id === id);
        if (course) openModal('edit', course);
      }));
      tbody.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-del');
        if (!confirm('Delete this course? This action cannot be undone.')) return;
        state.courses = state.courses.filter(c => c.id !== id);
        save(state.courses);
        render();
      }));
    }

    function render() {
      renderTable();
    }

    // Modal lifecycle
    addBtn.addEventListener('click', () => openModal('add'));
    closeModal.addEventListener('click', closeModalSafe);
    cancelModal.addEventListener('click', closeModalSafe);

    saveCourseBtn.addEventListener('click', (e) => {
      e.preventDefault();
      if (!nameEl.value || !codeEl.value) return;
      const id = courseId.value;
      if (id) {
        const i = state.courses.findIndex(c => c.id === id);
        if (i !== -1) {
          state.courses[i] = { ...state.courses[i], name: nameEl.value, code: codeEl.value };
        }
      } else {
        state.courses.unshift({ id: uid(), name: nameEl.value, code: codeEl.value, enrolled: 0 });
      }
      save(state.courses);
      closeModalSafe();
      render();
    });

    // Init
    seedIfEmpty();
    state.courses = load();
    render();
  </script>
</body>
</html>
