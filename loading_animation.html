<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utycc Building </title>
    <style>
        :root {
            /* Using a CSS variable for the building color for easy changes */
            --building-color: rgba(30, 58, 138, 1);
            --animation-duration: 4s;
        }

        body {
            /* Center the icon on the page for better viewing */
            display: grid;
            place-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #ffffff;
        }
        
        /* This container clips the animations, so elements appear to fly in from nowhere */
        .animation-container {
            width: 300px;
            height: 250px;
            overflow: hidden;
            position: relative;
            display: grid;
            place-items: center;
        }

        .building-container {
            /* This container sets the overall size and perspective for the icon */
            position: relative;
            width: 300px;
            height: 220px;
        }

        /* Common style for all blue parts of the building */
        .building-part {
            position: absolute;
            background-color: var(--building-color);
            /* Set initial state for animation */
            opacity: 0; 
        }

        /* Main horizontal base of the building */
        .base {
            width: 100%;
            height: 10%;
            bottom: 0;
            left: 0;
            animation: rise-in-out var(--animation-duration) ease-in-out infinite 0s;
        }

        /* The central section with pillars */
        .main-section {
            width: 50%;
            height: 55%;
            bottom: 10%;
            left: 25%;
            background-color: var(--building-color);
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            animation: rise-in-out var(--animation-duration) ease-in-out infinite 0.1s;
        }
        
        .pillar {
            width: 12%;
            height: 100%;
            background-color: white;
        }

        /* The wings on the left and right sides */
        .wing {
            width: 25%;
            height: 45%;
            bottom: 10%;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
        }
        
        .left-wing {
            left: 0;
            animation: slide-from-left var(--animation-duration) ease-in-out infinite 0.2s;
        }

        .right-wing {
            right: 0;
            animation: slide-from-right var(--animation-duration) ease-in-out infinite 0.2s;
        }

        .window-row {
            display: flex;
            justify-content: space-evenly;
            width: 100%;
        }

        .window {
            width: 20%;
            padding-bottom: 20%; 
            background-color: white;
        }

        /* Layered roof structure */
        .roof-base {
            width: 100%;
            height: 8%;
            bottom: 65%;
            left: 0;
            animation: drop-from-top var(--animation-duration) ease-in-out infinite 0.3s;
        }
        
        .roof-middle {
            width: 60%;
            height: 8%;
            bottom: 73%;
            left: 20%;
            animation: drop-from-top var(--animation-duration) ease-in-out infinite 0.4s;
        }

        .roof-top {
            width: 40%;
            height: 6%;
            bottom: 81%;
            left: 30%;
            animation: drop-from-top var(--animation-duration) ease-in-out infinite 0.5s;
        }

        /* Flagpole and flag on top */
        .flag-pole {
            width: 1.5%;
            height: 13%;
            bottom: 87%;
            left: 49.25%;
            animation: drop-from-top var(--animation-duration) ease-in-out infinite 0.6s;
        }

        .flag {
            width: 8%;
            height: 6%;
            bottom: 94%;
            left: 50.75%;
            animation: drop-from-top var(--animation-duration) ease-in-out infinite 0.6s;
        }
        
        /* The star/sparkle elements */
        .star {
            width: 10px;
            height: 10px;
            position: absolute;
            animation: twinkle var(--animation-duration) ease-in-out infinite;
        }
        
        .star::before, .star::after {
            content: '';
            position: absolute;
            background-color: var(--building-color);
        }
        .star::before { width: 100%; height: 2px; top: 4px; }
        .star::after { width: 2px; height: 100%; left: 4px; }
        
        .star-left { top: 15%; left: 12%; }
        .star-right { top: 15%; right: 12%; }
        
        /* --- KEYFRAME ANIMATIONS --- */

        @keyframes rise-in-out {
            0%, 100% { transform: translateY(150%); opacity: 0; }
            25%, 75% { transform: translateY(0); opacity: 1; }
        }

        @keyframes slide-from-left {
            0%, 100% { transform: translateX(-150%); opacity: 0; }
            25%, 75% { transform: translateX(0); opacity: 1; }
        }

        @keyframes slide-from-right {
            0%, 100% { transform: translateX(150%); opacity: 0; }
            25%, 75% { transform: translateX(0); opacity: 1; }
        }

        @keyframes drop-from-top {
            0%, 100% { transform: translateY(-150%); opacity: 0; }
            25%, 75% { transform: translateY(0); opacity: 1; }
        }

        @keyframes twinkle {
            0%, 30%, 80%, 100% { opacity: 0; transform: scale(0.5); }
            40% { opacity: 1; transform: scale(1.2); }
            50%, 70% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="animation-container">
        <div class="building-container">
            <!-- Building components are layered from back to front -->
            <div class="building-part base"></div>
            <div class="building-part main-section">
                <div class="pillar"></div>
                <div class="pillar"></div>
                <div class="pillar"></div>
            </div>
            <div class="building-part wing left-wing">
                 <div class="window-row">
                    <div class="window"></div>
                    <div class="window"></div>
                </div>
                <div class="window-row">
                    <div class="window"></div>
                    <div class="window"></div>
                </div>
            </div>
            <div class="building-part wing right-wing">
                <div class="window-row">
                    <div class="window"></div>
                    <div class="window"></div>
                </div>
                <div class="window-row">
                    <div class="window"></div>
                    <div class="window"></div>
                </div>
            </div>
            <div class="building-part roof-base"></div>
            <div class="building-part roof-middle"></div>
            <div class="building-part roof-top"></div>
            <div class="building-part flag-pole"></div>
            <div class="building-part flag"></div>
            
            <!-- Stars -->
            <div class="star star-left"></div>
            <div class="star star-right"></div>
        </div>
    </div>
</body>
</html>
