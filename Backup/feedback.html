<!DOCTYPE html>
<html lang="en">
  <head>
    <link
      rel="shortcut icon"
      href="../Img/logo/utycc_logo_favicon/favicon.ico"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="./CSS/footer.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedbacks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      /* Animation Classes */
      .animate-fade-in {
        animation: fadeIn 0.6s ease-out forwards;
      }
      .animate-fade-up {
        animation: fadeUp 0.6s ease-out forwards;
      }
      .animate-fade-down {
        animation: fadeDown 0.4s ease-out forwards;
      }
      .animate-scale-in {
        animation: scaleIn 0.4s ease-out forwards;
      }
      .animate-pulse {
        animation: pulse 1s ease infinite;
      }
      .animate-ripple {
        animation: ripple 0.6s linear forwards;
      }

      /* Keyframes */
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes fadeDown {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes scaleIn {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }
      @keyframes ripple {
        to {
          transform: scale(4);
          opacity: 0;
        }
      }

      /* Custom Components */
      .star-rating {
        direction: rtl;
        display: inline-block;
      }
      .star-rating input[type="radio"] {
        display: none;
      }
      .star-rating label {
        color: #ddd;
        font-size: 2rem;
        padding: 0 5px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .star-rating label:hover,
      .star-rating label:hover ~ label,
      .star-rating input[type="radio"]:checked ~ label {
        color: #f8d64e;
        transform: scale(1.1);
      }
      .file-upload {
        position: relative;
        overflow: hidden;
        transition: all 0.3s ease;
      }
      .file-upload:hover {
        border-color: #818cf8;
        transform: translateY(-2px);
      }
      .file-upload-input {
        position: absolute;
        font-size: 50px;
        opacity: 0;
        right: 0;
        top: 0;
        cursor: pointer;
      }
      .feedback-card {
        transition: all 0.3s ease;
        transform-origin: top center;
      }
      .feedback-card:hover {
        transform: translateY(-5px) scale(1.02);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1),
          0 10px 10px -5px rgba(0, 0, 0, 0.04);
      }
      .file-preview {
        max-width: 100px;
        max-height: 100px;
        margin-right: 10px;
        margin-bottom: 10px;
        border-radius: 5px;
        object-fit: cover;
        transition: all 0.3s ease;
      }
      .file-preview:hover {
        transform: scale(1.1);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1),
          0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
    </style>
  </head>
  <body
    class="bg-gradient-to-br from-blue-50 to-purple-50 min-h-screen opacity-0 animate-fade-in"
  >
   <!--header   -->


   <!--header  -->
    <!-- <div class="container mx-auto px-4 py-12"> -->
      <!-- Header with animation -->
      <header
        class="text-center mb-12 opacity-0 animate-fade-up"
        style="animation-delay: 0.2s"
      >
        <h1 class="text-4xl font-bold text-indigo-800 mb-3">
          Share Your Feedback
        </h1>
        <p class="text-lg text-gray-600 max-w-2xl mx-auto">
          We value your opinion! Please share your experience with us.
        </p>
      </header>

      <!-- Feedback Form with staggered animations -->
      <div
        class="bg-white rounded-xl shadow-lg p-8 max-w-3xl mx-auto mb-16 opacity-0 animate-scale-in"
        style="animation-delay: 0.4s"
      >
        <h2
          class="text-2xl font-semibold text-gray-800 mb-6 opacity-0 animate-fade-down"
          style="animation-delay: 0.6s"
        >
          Submit Feedback
        </h2>

        <form id="feedbackForm" class="space-y-6">
          <!-- Name Field -->
          <div class="opacity-0 animate-fade-up" style="animation-delay: 0.7s">
            <label
              for="name"
              class="block text-sm font-medium text-gray-700 mb-1"
              >Your Name</label
            >
            <input
              type="text"
              id="name"
              name="name"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-200"
              placeholder="John Doe"
              required
            />
          </div>

          <!-- Email Field -->
          <div class="opacity-0 animate-fade-up" style="animation-delay: 0.8s">
            <label
              for="email"
              class="block text-sm font-medium text-gray-700 mb-1"
              >Email (optional)</label
            >
            <input
              type="email"
              id="email"
              name="email"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-200"
              placeholder="john@example.com"
            />
          </div>
          <!-- Comments -->
          <div class="opacity-0 animate-fade-up" style="animation-delay: 1s">
            <label
              for="comments"
              class="block text-sm font-medium text-gray-700 mb-1"
              >Your Problems</label
            >
            <textarea
              id="comments"
              name="comments"
              rows="4"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-200"
              placeholder="Share your problems..."
              required
            ></textarea>
          </div>
          <!-- Submit Button -->
          <div
            class="pt-2 opacity-0 animate-fade-up"
            style="animation-delay: 1.2s"
          >
            <button
              type="submit"
              id="submitBtn"
              class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-4 rounded-lg transition duration-300 flex items-center justify-center relative overflow-hidden"
            >
              <span class="relative z-10 flex items-center">
                <svg
                  class="w-5 h-5 mr-2"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                  ></path>
                </svg>
                Submit
              </span>
            </button>
          </div>
        </form>
      </div>
    <!-- Success Modal -->
    
    <!-- footer -->

    <!-- foooter -->
  </body>
</html>
