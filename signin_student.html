<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Signin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* External CSS is now embedded here */
        :root {
            --bg-light: #ecf0f1;
            --bg-dark: #34495e;
            --card-bg: #ffffff;
            --text-primary: #2c3e50;
            --text-muted: #7f8c8d;
            --border-color: #bdc3c7;
            --accent-color: #3498db;
            --accent-hover: #2980b9;
            --error-color: #e74c3c;
            --success-color: #2ecc71;
            --shadow-light: 0 4px 15px rgba(0, 0, 0, 0.08);
            --shadow-dark: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        /* Base Styles & Reset */
        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            color: var(--text-primary);
            background: var(--bg-light);
            display: grid;
            place-items: center;
            padding: 16px;
        }

        /* --- MODIFICATION START --- */
        /* New container to hold both form and image */
        .auth-wrapper {
            width: min(900px, 95vw);
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: var(--shadow-light);
            overflow: hidden;
            /* To keep rounded corners on the image */
            animation: fadeIn .4s ease-out both;
        }

        /* The original shell, now acting as the form panel */
        .shell {
            flex: 1 1 50%;
            /* Takes up half the space */
            padding: 32px 28px;
            /* Removed individual border, shadow, etc. as it's on the wrapper now */
        }

        /* New container for the image */
        .image-panel {
            flex: 1 1 50%;
            /* Takes up the other half */
            display: block;
            /* Shown by default */
        }

        .image-panel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* --- MODIFICATION END --- */


        /* Header & Logo */
        .g-head {
            display: grid;
            justify-items: center;
            gap: 8px;
            text-align: center;
            margin-bottom: 8px;
        }

        .brand-logo {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .brand-logo:hover {
            transform: scale(1.1);
        }

        h1 {
            margin: 8px 0 4px;
            font-size: 28px;
            font-weight: 700;
        }

        .sub {
            color: var(--text-muted);
            font-size: 15px;
        }

        /* Forms */
        form {
            display: grid;
            gap: 20px;
            margin-top: 24px;
        }

        .field {
            display: grid;
            gap: 8px;
        }

        label {
            font-size: 14px;
            font-weight: 500;
        }

        .input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-primary);
            outline: none;
            transition: border-color .2s ease, box-shadow .2s ease;
        }

        .input::placeholder {
            color: var(--text-muted);
        }

        .input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .link {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .link:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }

        .btn {
            appearance: none;
            border: 0;
            cursor: pointer;
            border-radius: 8px;
            padding: 12px 20px;
            font-weight: 700;
            color: #fff;
            background: var(--accent-color);
            box-shadow: var(--shadow-dark);
            transition: background-color 0.2s ease, transform .1s ease;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* Toggle Views */
        .view {
            display: none;
        }

        .view.active {
            display: block;
            animation: fadeIn .3s ease-out;
        }

        /* Footer & Checkbox */
        footer {
            margin-top: 24px;
            text-align: center;
            font-size: 14px;
        }

        .term-label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
        }

        .term-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--accent-color);
        }

        .term-label a {
            font-weight: 400;
        }


        /* Toasts */
        .toast-wrap {
            position: fixed;
            top: 20px;
            right: 20px;
            width: min(360px, 92vw);
            display: grid;
            gap: 12px;
            z-index: 50;
            pointer-events: none;
        }

        .toast {
            pointer-events: auto;
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            border-radius: 10px;
            color: var(--card-bg);
            background: var(--text-primary);
            box-shadow: var(--shadow-dark);
            border-left: 4px solid var(--accent-color);
            animation: toastIn .3s ease forwards, toastOut .3s ease 4.2s forwards;
        }

        .toast.error {
            border-left-color: var(--error-color);
        }

        .toast.success {
            border-left-color: var(--success-color);
        }

        .toast .close-btn {
            appearance: none;
            border: 0;
            background: transparent;
            color: #fff;
            opacity: .7;
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
        }

        .toast .close-btn:hover {
            opacity: 1;
        }
        /* Force blue color for disabled checkbox with id='term' */
        input[type='checkbox'][id='term']:disabled {
            accent-color: #3498db !important;
            opacity: 1 !important;
            filter: none !important;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(100%);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes toastOut {
            from {
                opacity: 1;
                transform: translateX(0);
            }

            to {
                opacity: 0;
                transform: translateX(100%);
            }
        }

        /* Responsive Styles */
        /* --- MODIFICATION START --- */
        /* On screens smaller than 800px, hide the image and revert to original form style */
        @media (max-width: 800px) {
            .auth-wrapper {
                width: min(450px, 92vw);
                /* Revert to original width */
                flex-direction: column;
                /* Stack them */
            }

            .image-panel {
                display: none;
                /* Hide the image panel */
            }

            .shell {
                width: 100%;
                /* Ensure form takes full width of the container */
            }
        }

        /* --- MODIFICATION END --- */

        @media (max-width: 400px) {
            .shell {
                padding: 24px 18px;
            }

            .row {
                flex-direction: column-reverse;
                gap: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="toast-wrap"></div>

    <!-- New wrapper for form and image -->
    <div class="auth-wrapper">

        <!-- Original form content goes here -->
        <div class="shell">
            <header class="g-head">
                <a href="./home.html">
                    <img src="Img/logo/utycc_logo_favicon/logo.png" alt="UTYCC Logo" class="brand-logo" />
                </a>
                <h1 id="auth-heading">Sign in</h1>
                <p id="auth-sub" class="sub">to continue to UTYCC</p>
            </header>

            <div id="view-login" class="view active">
                <form id="login-form">
                    <div class="field">
                        <label for="login-id">Name</label>
                        <input type="text" id="login-name" class="input" placeholder="GayNigga69"
                            required>
                    </div>
                    <div class="field">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" class="input" placeholder="mail@example.com"
                            required>
                    </div>
                    <div class="field">
                        <label for="login-password">Phone Number</label>
                        <input type="phone" id="login-phone" class="input" placeholder="Your phone number" required>
                    </div>
                    <div class="row">
                        <button type="submit" class="btn">Sign In</button>
                    </div>
                </form>

            </div>
        </div>

        <!-- New image panel -->
        <div class="image-panel">
            <img src="./Img/hero-carousel/3.JPG" style="opacity: 70%" alt="UTYCC Photo">
        </div>

    </div>

    <script>
        // Simplified JS for the Login Form only
        (function () {
            // Helper function to select elements
            const $ = (sel, root = document) => root.querySelector(sel);

            // Get references to DOM elements
            const loginForm = $('#login-form');
            const toastWrap = $('.toast-wrap');

            // Function to create and display a toast message
            function showToast(message, type = 'success', duration = 4000) {
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.innerHTML = `<span>${message}</span><button class="close-btn" aria-label="Close">×</button>`;
                const closer = toast.querySelector('.close-btn');
                const removeToast = () => toast.remove();
                closer.addEventListener('click', removeToast);
                toastWrap.appendChild(toast);
                setTimeout(removeToast, duration);
            }

            // Validation helper for email format
            function isValidEmail(email) {
                return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
            }

            // Login form submission handler
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault(); // Prevent actual form submission for the demo

                // Get form values
                const adminId = $('#login-id', loginForm).value.trim();
                const email = $('#login-email', loginForm).value.trim();
                const password = $('#login-password', loginForm).value;
                
                // Basic Validation
                if (!adminId) {
                    showToast('Please enter your Admin ID.', 'error');
                    return;
                }
                if (!isValidEmail(email)) {
                    showToast('Please enter a valid email address.', 'error');
                    return;
                }
                if (!password || password.length < 6) {
                    showToast('Password must be at least 6 characters long.', 'error');
                    return;
                }
                
                // If validation passes, show success message.
                // In a real application, you would send this to a server.
                showToast('Sign in successful. Welcome back!', 'success');
            });
        })();
    </script>
</body>

</html>
